storyId: NOTIFICACAO-MENSAGEM-FACCAO
verdict: FAIL
iteracao: 2
data: 2026-07-16
ambiente: Fábrica Teste (fabrica-teste-31ykr) · dev localhost:3001 · sessão REAL

resumo: >
  O toast continua NÃO disparando — mas a causa NÃO era a que tratamos. A correção do
  Dex (setAuth no onAuthStateChange) está tecnicamente correta e não tem defeito; ela
  apenas se apoia numa fundação que não existe: o cliente do navegador NUNCA consegue
  ler a sessão, porque o middleware reescreve o cookie de auth como httpOnly.
  Isto é um CONFLITO ARQUITETURAL, não um bug de código. Exige decisão do Gabriel.

causa_raiz_definitiva:
  arquivo: src/middleware.ts:52
  codigo: 'response.cookies.set(name, value, { ...options, httpOnly: true, ... })'
  efeito: >
    O cookie de sessão é invisível ao JavaScript. createBrowserClient (@supabase/ssr)
    lê a sessão de document.cookie — logo, jamais a encontra. Sem sessão, não há JWT
    para entregar ao socket do Realtime; o socket fica com a anon key; a RLS nega tudo
    (a Dara provou: anônimo recebe 0 de 41). Canal SUBSCRIBED e MUDO.
  natureza: >
    NÃO é defeito. httpOnly é hardening deliberado e correto: impede que um XSS roube
    o token da sessão. O conflito é real: postgres_changes com RLS EXIGE o JWT no
    navegador; httpOnly EXISTE para negar o token ao navegador. São mutuamente
    exclusivos por construção.

evidencia_runtime:
  eventos_de_auth: [{ ev: INITIAL_SESSION, temToken: false }]   # dispara SEM sessão
  getSession_do_browser: null
  socket_realtime: "anon (não-JWT)"
  canais: [{ topic: "realtime:faction-messages-notify", state: joined }]
  document_cookie_auth: ausente        # httpOnly
  localStorage: vazio
  contraprova_servidor: >
    O dashboard renderiza e /api/me/permissions devolve 200 com 21 permissões — o
    SERVIDOR enxerga a sessão perfeitamente. Só o navegador não vê. Definição de httpOnly.

por_que_o_teste_anterior_enganou: >
  Na 1ª iteração o cookie ERA legível e o setAuth manual funcionou (0 → 1 evento).
  Motivo: logo após o login o cookie é gravado pelo cliente, ainda sem httpOnly. Na
  requisição seguinte o middleware o REESCREVE com httpOnly e ele some do JS para
  sempre. A janela de sucesso é o intervalo entre o login e o primeiro passe pelo
  middleware — por isso a cura pareceu comprovada e não era sustentável.

