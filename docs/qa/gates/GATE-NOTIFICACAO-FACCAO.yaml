  liserie: INTOCADA (10 msgs — as 9 originais + 1 REAL do cliente, preservada)
  instrumentacao_QA: removida; supabase-browser.ts idêntico ao entregue pelo Dex; tsc limpo
  temporarios: removidos
  dev_server_qa_3001: encerrado
  porta_3000_PID_9580: não tocado

decisao: >
  BLOQUEIA O COMMIT. Não é caso de devolver ao @dev para "consertar" — o código dele
  está correto. É decisão de arquitetura/risco do Gabriel: escolher A, B ou C.
  A correção do Dex (setAuth) deve ser MANTIDA se a escolha for A; descartada se for C.
