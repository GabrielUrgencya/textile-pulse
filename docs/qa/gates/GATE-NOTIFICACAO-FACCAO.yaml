decisao_necessaria_do_gabriel:
  contexto: >
    Escolher COMO o navegador passa a receber o evento, sabendo que o httpOnly (que a
    auditoria endureceu) é inegociável até ele dizer o contrário.
  opcao_A_endpoint_de_token:
    como: "/api/me/realtime-token devolve o access_token (o servidor lê o cookie httpOnly); cliente chama setAuth(token) e renova antes de expirar."
    isolamento: "MÁXIMO — mantém a RLS por assinante (o banco recusa cross-tenant)."
    custo: "Expõe o access_token ao JS. Enfraquece PARTE do httpOnly: um XSS passaria a alcançar o access_token (curto, ~1h) — mas NÃO o refresh_token, que continua httpOnly."
  opcao_B_broadcast_do_servidor:
    como: "A rota que insere a mensagem publica em broadcast 'faction-messages:{tenantId}'; o cliente assina anônimo. É o padrão que a TV já usa (tv-config:{tenantId})."
    isolamento: "MÉDIO — depende do segredo do UUID do tenant. Canal broadcast é público: quem souber o UUID de outro tenant assina. Sem RLS."
    custo: "Zero exposição de token. Mantém httpOnly intacto."
  opcao_C_polling:
    como: "Poll global leve (ex.: 10s) num endpoint de não-lidas; toast ao detectar nova. O chat JÁ faz polling (lista 5s, conversa 2s) — é o padrão vigente do sistema."
    isolamento: "MÁXIMO — a API é escopada por tenant no servidor, com a sessão httpOnly."
    custo: "Latência de ~10s em vez de instantâneo. Nenhuma superfície de segurança nova."
  recomendacao_do_QA: >
    C, com A como segunda opção. Razões: (1) o sistema JÁ é polling no chat — C é
    coerente com a arquitetura vigente, não inventa conceito; (2) não abre nenhuma
    superfície nova logo depois de uma auditoria que fechou 1 CRITICAL e 1 HIGH;
    (3) para chat de fábrica, ~10s de latência é indistinguível de "tempo real" na
    prática. B é a que menos recomendo: troca RLS por segredo de UUID.

achado_de_producao:
  o_que: >
    A liserie tinha 9 mensagens e agora tem 10. A extra NÃO é minha: "Oiii", da facção
    KAUANY VITÓRIA, hoje às 18:45 (horário SP) — cliente real, enquanto trabalhávamos.
    NÃO foi tocada.
  significado: >
    É a prova viva do problema: uma facção real escreveu hoje e o Gabriel não recebeu
    aviso nenhum. A frente resolve uma dor concreta e presente, não hipotética.

higiene:
